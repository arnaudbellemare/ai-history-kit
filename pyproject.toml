[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-history-kit"
version = "0.1.0"
description = "Back up, clean, search, and turn your Claude Code, Codex, ChatGPT, and Claude.ai history into reviewable personal memories. Everything stays on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# `aihistory optimize train`. gepa 0.1.4 supports Python 3.10 to 3.14.
optimize = ["gepa==0.1.4; python_version < '3.15'"]
keywords = ["claude-code", "codex", "chatgpt", "agent-memory", "personal-ai", "privacy"]

[project.scripts]
aihistory = "aihistory.cli:main"

[tool.setuptools.packages.find]
include = ["aihistory*"]
